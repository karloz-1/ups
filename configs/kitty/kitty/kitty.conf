# Font Configuration
font_size 12.0

# Window Configuration
window_padding_width 12
background_opacity 1.0
background_blur 32
hide_window_decorations yes

# Cursor Configuration
cursor_shape block
cursor_blink_interval 1

# Scrollback
scrollback_lines 3000

# Terminal features
copy_on_select yes
strip_trailing_spaces smart

# Key bindings for common actions
map ctrl+shift+n new_window
map ctrl+t new_tab
map ctrl+plus change_font_size all +1.0
map ctrl+minus change_font_size all -1.0
map ctrl+0 change_font_size all 0

# Tab configuration
tab_bar_style powerline
tab_bar_align left

# Shell integration
shell_integration enabled

# Dank color generation
include dank-tabs.conf
include dank-theme.conf

# -----------------------------------------------------------------------------
# DISPOSICIÓN DE PANELES (Layouts)
# -----------------------------------------------------------------------------
# Permite cambiar entre paneles horizontales, verticales y cuadrícula
enabled_layouts splits,stack

# -----------------------------------------------------------------------------
# CREAR PANELES
# -----------------------------------------------------------------------------
# Alt + Shift + S : Dividir horizontalmente (panel abajo)
map alt+shift+s launch --location=hsplit --cwd=current

# Alt + Shift + V : Dividir verticalmente (panel a la derecha)
map alt+shift+v launch --location=vsplit --cwd=current

# -----------------------------------------------------------------------------
# NAVEGAR ENTRE PANELES (Estilo Vim: H, J, K, L)
# -----------------------------------------------------------------------------
# Alt + H/J/K/L para moverse de panel
map alt+h neighboring_window left
map alt+j neighboring_window down
map alt+k neighboring_window up
map alt+l neighboring_window right

# -----------------------------------------------------------------------------
# CERRAR Y REDIMENSIONAR PANELES
# -----------------------------------------------------------------------------
# Alt + Shift + Q : Cerrar el panel actual sin confirmar
map alt+shift+q close_window

# Alt + Shift + F : Maximizar/restaurar el panel actual (Modo Enfoque)
map alt+shift+f toggle_layout stack

# Alt + Flechas : Redimensionar panel
map alt+left  resize_window narrower
map alt+right resize_window wider
map alt+up    resize_window taller
map alt+down  resize_window shorter
